name: Chery
description: 'Chery Automobile Co., Ltd. is a Chinese state-owned automobile manufacturer headquartered in Wuhu, Anhui, and one of China''s largest passenger-vehicle exporters, conducting business in more than 130 countries and regions. Its brand portfolio spans the core Chery marque (TIGGO and ARRIZO SUV and sedan series), the Fengyun and OMODA/JAECOO new-energy lines, and the QQ city-car brand, with a growing emphasis on the CSH (Chery Super Hybrid) powertrain and connected-vehicle technology. Chery was surfaced as a portfolio company of IDG Capital and added to the API Evangelist network for enrichment. As an automotive manufacturer, Chery publishes corporate and consumer web properties but no public developer portal or API surface was found during this pass.'
